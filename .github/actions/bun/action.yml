name: Run bun
description: Install dependencies, run checks, produce dist/

runs:
  using: composite
  steps:
    # Restore the bun install cache. If there is no cache for the current
    # lockfile, fall back to the most recent cache for this OS and arch.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

    # Install bun on the GitHub Actions runner.
    # https://bun.com/guides/runtime/cicd
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.x

    # Install dependencies. Fail if bun.lock is out of sync with package.json.
    - run: bun install --frozen-lockfile
      shell: bash

    # Type-check, lint, then write dist/.
    - run: bun run check
      shell: bash
    - run: bun run lint
      shell: bash
    - run: bun run build
      shell: bash

    # Cheap safeguard: check whether index.html exists
    - run: test -s dist/index.html
      shell: bash
